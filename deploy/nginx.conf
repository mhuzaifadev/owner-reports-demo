# /etc/nginx/sites-available/owner-reports
# Replace owner-reports.mhuzaifa.com with your subdomain, then:
#   ln -s /etc/nginx/sites-available/owner-reports /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d owner-reports.mhuzaifa.com

# Second layer of rate limiting in front of the API (the app has its own per-IP hourly limit).
limit_req_zone $binary_remote_addr zone=drafts:10m rate=6r/m;

server {
    listen 80;
    server_name owner-reports.mhuzaifa.com;

    root /var/www/owner-reports;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /data/portfolio.json {
        add_header Cache-Control "no-store";
    }

    location /api/drafts {
        limit_req zone=drafts burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }
}
